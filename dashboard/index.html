<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Batutynas — Užsakymų valdymas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   1. CSS RESET
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  tab-size: 4;
}

body {
  min-height: 100vh;
  line-height: inherit;
}

img,
picture,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
}

input,
button,
textarea,
select {
  font: inherit;
}

p,
h1,
h2,
h3,
h4,
h5,
h6 {
  overflow-wrap: break-word;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: inherit;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

/* ==========================================================================
   2. CSS CUSTOM PROPERTIES
   ========================================================================== */

:root {
  /* Backgrounds */
  --bg: #F7F6F2;
  --bg-card: #FFFFFF;
  --bg-inset: #EFEDE8;

  /* Borders */
  --border: #E2DED6;
  --border-strong: #C8C3B8;

  /* Text */
  --text: #1A1814;
  --text-dim: #6B6560;
  --text-faint: #A8A29C;

  /* Accent — brand orange */
  --accent: #FF5C2B;
  --accent-dim: #FFF0EC;
  --accent-hover: #E84D20;

  /* Semantic colours */
  --green: #16A34A;
  --green-dim: #F0FDF4;

  --yellow: #D97706;
  --yellow-dim: #FFFBEB;

  --blue: #2563EB;
  --blue-dim: #EFF6FF;

  --red: #DC2626;
  --red-dim: #FEF2F2;

  --gray: #6B7280;
  --gray-dim: #F9FAFB;

  /* Shape */
  --radius: 10px;
  --radius-sm: 6px;

  /* Elevation */
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.08);
}

/* ==========================================================================
   3. TYPOGRAPHY BASE
   ========================================================================== */

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-feature-settings: "tnum" 1;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
}

h1 {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

h2 {
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.2;
}

h3 {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.3;
}

/* Utility: small label / eyebrow text */
.label {
  font-size: 0.625rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-faint);
}

/* Utility: muted text */
.text-dim {
  color: var(--text-dim);
}

/* Utility: accent text */
.text-accent {
  color: var(--accent);
}

/* ============================================================
   02-css-layout.css — Dashboard Layout
   ============================================================ */

/* HEADER */
.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

.header-brand {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
}

.header-logo {
  font-size: 1.5rem;
  line-height: 1;
}

.header-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.header-actions {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

.header-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}

.header-btn:hover {
  background: var(--bg-inset);
}

.header-updated {
  font-size: 0.7rem;
  color: var(--text-faint);
}

/* STATS BAR */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 16px 20px;
}

.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.stat-card.accent {
  border-left: 3px solid var(--accent);
}

.stat-label {
  font-size: 0.625rem;
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  margin-bottom: 6px;
}

.stat-value {
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.stat-sub {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 4px;
}

/* MAIN SPLIT LAYOUT */
.main-layout {
  padding: 0 20px;
}

/* CALENDAR PANE */
.calendar-pane {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* SIDE PANEL */
.side-panel {
  display: none;
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* EQUIPMENT SECTION */
.equipment-section {
  padding: 20px;
}

.equipment-title {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 12px;
  color: var(--text);
}

.equipment-strip {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.equipment-strip::-webkit-scrollbar {
  display: none;
}

/* RESPONSIVE — 640px: stats go 4-column */
@media (min-width: 640px) {
  .stats-bar {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* RESPONSIVE — 768px: two-column layout, side panel visible */
@media (min-width: 768px) {
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    padding: 20px;
  }

  .side-panel {
    display: block;
    position: sticky;
    top: 16px;
    height: calc(100vh - 32px);
    overflow-y: auto;
  }

  .equipment-strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    overflow-x: unset;
    padding-bottom: 0;
    -webkit-overflow-scrolling: unset;
    scroll-snap-type: unset;
  }

  .mobile-only {
    display: none;
  }

  .desktop-only {
    display: block;
  }
}

/* RESPONSIVE — 1280px: wider spacing, larger stat values */
@media (min-width: 1280px) {
  .stats-bar {
    gap: 16px;
    padding: 20px 28px;
  }

  .main-layout {
    gap: 32px;
    padding: 24px 28px;
  }

  .stat-value {
    font-size: clamp(2rem, 3vw, 2.75rem);
  }

  .stat-card {
    padding: 20px;
  }

  .dashboard-header {
    padding: 18px 28px;
  }
}

/* ============================================================
   03-css-components.css — UI component styles
   ============================================================ */

/* MONTH NAVIGATION */
.month-nav {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px;
}

.month-nav-title {
  font-size: 1.1rem;
  font-weight: 700;
  min-width: 180px;
  text-align: center;
}

.month-nav-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-nav-btn:hover {
  background: var(--bg-inset);
  border-color: var(--border-strong);
}

.month-nav-today {
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.month-nav-today:hover {
  background: var(--accent-hover);
}

/* CALENDAR GRID */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-header {
  font-size: 0.7rem;
  font-weight: 700;
  text-align: center;
  padding: 8px 4px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cal-day {
  min-height: 60px;
  padding: 6px;
  border: 1px solid var(--border);
  border-top: none;
  border-left: none;
  cursor: pointer;
  position: relative;
  transition: background 0.12s;
}

.cal-day:nth-child(7n) {
  border-right: none;
}

.cal-day:hover {
  background: var(--bg-inset);
}

.cal-day.today {
  background: var(--accent-dim);
}

.cal-day.today .cal-day-num {
  color: var(--accent);
  font-weight: 800;
}

.cal-day.selected {
  background: var(--accent-dim);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.cal-day.other-month {
  opacity: 0.3;
  pointer-events: none;
}

.cal-day:active {
  transform: scale(0.97);
  transition: transform 80ms;
}

.cal-day-num {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
}

.cal-day-dots {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.cal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.cal-dot.status-confirmed { background: var(--green); }
.cal-dot.status-delivered { background: var(--blue); }
.cal-dot.status-completed { background: var(--gray); }
.cal-dot.status-inquiry { background: var(--yellow); }
.cal-dot.status-cancelled { background: var(--red); }

.cal-day-count {
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: 0.6rem;
  font-weight: 800;
  background: var(--accent);
  color: #fff;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BOOKING CARD */
.booking-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}

.booking-card-header {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.booking-card-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}

.booking-card-time {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  font-feature-settings: "tnum" 1;
}

.booking-card-row {
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.booking-card-row .icon {
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}

.booking-card-equipment {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.booking-card-equip-tag {
  background: var(--bg-inset);
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-dim);
}

.booking-card-footer {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.booking-card-price {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
}

.booking-card a[href^="tel"] {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

/* STATUS BADGES */
.status-badge {
  display: inline-flex;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.65rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.status-badge.status-confirmed { background: var(--green-dim); color: var(--green); }
.status-badge.status-delivered { background: var(--blue-dim); color: var(--blue); }
.status-badge.status-completed { background: var(--gray-dim); color: var(--gray); }
.status-badge.status-inquiry { background: var(--yellow-dim); color: var(--yellow); }
.status-badge.status-cancelled { background: var(--red-dim); color: var(--red); }

/* PAYMENT BADGES */
.payment-badge {
  display: inline-flex;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.65rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.payment-badge.pay-paid { background: var(--green-dim); color: var(--green); }
.payment-badge.pay-deposit { background: var(--yellow-dim); color: var(--yellow); }
.payment-badge.pay-unpaid { background: var(--red-dim); color: var(--red); }

/* EQUIPMENT PILL */
.equip-pill {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  min-width: 140px;
  scroll-snap-align: start;
}

.equip-icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }
.equip-name { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.equip-status { display: block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }

.equip-available .equip-status { color: var(--green); }
.equip-reserved .equip-status { color: var(--yellow); }
.equip-rented .equip-status { color: var(--blue); }
.equip-in-transit .equip-status { color: var(--accent); }
.equip-needs-cleaning .equip-status { color: var(--yellow); }
.equip-damaged .equip-status { color: var(--red); }

/* DAY PANEL HEADER */
.panel-header { padding: 16px; border-bottom: 1px solid var(--border); }
.panel-date { font-size: 1.1rem; font-weight: 700; }
.panel-meta { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
.panel-body { padding: 12px; overflow-y: auto; }

/* DAY ACCORDION */
.day-accordion {
  grid-column: span 7;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: none;
  padding: 12px;
  overflow: hidden;
  transition: max-height 250ms ease-out;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 0.85rem;
  font-weight: 600;
  z-index: 1000;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.visible { opacity: 1; }
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }
.toast.info { background: var(--text); color: #fff; }

/* LOADING OVERLAY */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(247, 246, 242, 0.8);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
}

.loading-overlay.hidden { display: none; }

.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-faint); }
.empty-state-icon { font-size: 2rem; margin-bottom: 8px; }
.empty-state-text { font-size: 0.9rem; }

/* DEMO BANNER */
.demo-banner {
  background: var(--yellow-dim);
  color: var(--yellow);
  text-align: center;
  padding: 8px;
  font-size: 0.75rem;
  font-weight: 600;
}

/* ============================================================
   04 — ANIMATIONS
   ============================================================ */

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOutUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
@keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 600px; } }

.panel-body { transition: opacity 150ms ease-in, transform 150ms ease-in; }
.panel-body.entering { animation: fadeInUp 200ms ease-out forwards; }
.panel-body.exiting { animation: fadeOutUp 150ms ease-in forwards; }

.stat-card { animation: fadeInUp 400ms ease-out both; }
.stat-card:nth-child(1) { animation-delay: 50ms; }
.stat-card:nth-child(2) { animation-delay: 100ms; }
.stat-card:nth-child(3) { animation-delay: 150ms; }
.stat-card:nth-child(4) { animation-delay: 200ms; }

.booking-card { animation: fadeInUp 250ms ease-out both; }
.booking-card:nth-child(1)  { animation-delay: 60ms; }
.booking-card:nth-child(2)  { animation-delay: 120ms; }
.booking-card:nth-child(3)  { animation-delay: 180ms; }
.booking-card:nth-child(4)  { animation-delay: 240ms; }
.booking-card:nth-child(5)  { animation-delay: 300ms; }

.header-btn:active, .month-nav-btn:active { transform: scale(0.92); transition: transform 60ms; }
.month-nav-today:active { transform: scale(0.95); }

.header-btn.refreshing { animation: spin 0.8s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}

.side-panel::-webkit-scrollbar { width: 4px; }
.side-panel::-webkit-scrollbar-track { background: transparent; }
.side-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.side-panel::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Demo Banner (shown when using fallback data) -->
<div id="demoBanner" class="demo-banner" style="display:none;">
  ⚠️ Demo režimas — rodomi pavyzdiniai duomenys
</div>

<!-- Header -->
<header class="dashboard-header">
  <div class="header-brand">
    <span class="header-logo">🎪</span>
    <span class="header-title">Batutynas</span>
  </div>
  <div class="header-actions">
    <span class="header-updated" id="lastUpdated"></span>
    <button class="header-btn" id="refreshBtn" title="Atnaujinti">↻</button>
  </div>
</header>

<!-- Stats Bar -->
<section class="stats-bar">
  <div class="stat-card accent">
    <div class="stat-label">Šiandien užsakymų</div>
    <div class="stat-value" id="statTodayCount">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Savaitės pajamos</div>
    <div class="stat-value" id="statWeekRevenue">—</div>
    <div class="stat-sub" id="statWeekSub"></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Neapmokėti avansai</div>
    <div class="stat-value" id="statUnpaid">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Laisva įranga</div>
    <div class="stat-value" id="statAvailable">—</div>
    <div class="stat-sub" id="statAvailableSub"></div>
  </div>
</section>

<!-- Main Layout -->
<main class="main-layout">
  <!-- Calendar Pane -->
  <div class="calendar-pane">
    <!-- Month Navigation -->
    <div class="month-nav">
      <button class="month-nav-btn" id="prevMonth" title="Ankstesnis mėnuo">‹</button>
      <button class="month-nav-today" id="todayBtn">Šiandien</button>
      <span class="month-nav-title" id="monthTitle"></span>
      <button class="month-nav-btn" id="nextMonth" title="Kitas mėnuo">›</button>
    </div>
    <!-- Calendar Grid -->
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Side Panel (desktop) -->
  <aside class="side-panel" id="sidePanel">
    <div class="panel-header">
      <div class="panel-date" id="panelDate">Pasirinkite dieną</div>
      <div class="panel-meta" id="panelMeta"></div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="empty-state">
        <div class="empty-state-icon">📅</div>
        <div class="empty-state-text">Pasirinkite dieną kalendoriuje</div>
      </div>
    </div>
  </aside>
</main>

<!-- Equipment Section -->
<section class="equipment-section">
  <div class="equipment-title">🎪 Įrangos būsena</div>
  <div class="equipment-strip" id="equipStrip"></div>

function getPickupTime(b) {
  return (b.pickup_time || '').slice(0, 5);
}

function getEquipmentNames(b) {
  if (Array.isArray(b.equipment_names)) return b.equipment_names;
  if (Array.isArray(b.equipment)) return b.equipment.map(function(e) { return typeof e === 'string' ? e : e.name; });
  return [];
}

function getEquipmentIcons(b) {
  if (Array.isArray(b.equipment_icons)) return b.equipment_icons;
  if (Array.isArray(b.equipment)) return b.equipment.map(function(e) { return typeof e === 'string' ? '' : (e.icon || ''); });
  return [];
}

function getBookingsByDate(dateKey) {
  return state.bookings.filter(function(b) {
    return getDateKey(b) === dateKey;
  }).sort(function(a, b) {
    return (a.event_time || '').localeCompare(b.event_time || '');
  });
}

function getBookingsForMonth(year, month) {
  var byDay = {};
  state.bookings.forEach(function(b) {
    var key = getDateKey(b);
    if (!key) return;
    var d = new Date(key + 'T00:00:00');
    if (d.getFullYear() === year && d.getMonth() === month) {
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(b);
    }
  });
  return byDay;
}

function getDayRevenue(bookings) {
  var total = 0;
  bookings.forEach(function(b) {
    var p = parseFloat(b.price);
    if (!isNaN(p)) total += p;
  });
  return total;
}

function todayStr() { return fmtKey(new Date()); }

// ── CALENDAR ──────────────────────────────────────────────

function renderCalendar() {
  var grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Update month title
  document.getElementById('monthTitle').textContent =
    LT_MONTHS[state.viewMonth] + ' ' + state.viewYear;

  // Weekday headers (Mon-Sun)
  LT_WEEKDAYS.forEach(function(wd) {
    var hdr = document.createElement('div');
    hdr.className = 'cal-header';
    hdr.textContent = wd;
    grid.appendChild(hdr);
  });

  var year = state.viewYear;
  var month = state.viewMonth;
  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var daysInMonth = lastDay.getDate();

  // Monday-based: Mon=0 … Sun=6
  var startDow = (firstDay.getDay() + 6) % 7;

  // Get bookings grouped by day
  var byDay = getBookingsForMonth(year, month);
  var todayKey = fmtKey(new Date());

  // Previous month trailing days
  var prevMonthLast = new Date(year, month, 0).getDate();
  for (var i = startDow - 1; i >= 0; i--) {
    var day = prevMonthLast - i;
    var cell = createDayCell(day, null, [], true);
    grid.appendChild(cell);
  }

  // Current month days
  for (var d = 1; d <= daysInMonth; d++) {
    var dateKey = year + '-' + pad(month + 1) + '-' + pad(d);
    var dayBookings = byDay[dateKey] || [];
    var isToday = dateKey === todayKey;
    var cell = createDayCell(d, dateKey, dayBookings, false, isToday);
    grid.appendChild(cell);
  }

  // Next month leading days — fill to complete row
  var totalCells = startDow + daysInMonth;
  var remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (var n = 1; n <= remaining; n++) {
    var cell = createDayCell(n, null, [], true);
    grid.appendChild(cell);
  }
}

function createDayCell(dayNum, dateKey, bookings, isOther, isToday) {
  var cell = document.createElement('div');
  cell.className = 'cal-day';
  if (isOther) cell.classList.add('other-month');
  if (isToday) cell.classList.add('today');
  if (dateKey && dateKey === state.selectedDate) cell.classList.add('selected');
  if (dateKey) cell.dataset.date = dateKey;

  // Day number
  var num = document.createElement('div');
  num.className = 'cal-day-num';
  num.textContent = dayNum;
  cell.appendChild(num);

  // Booking dots
  if (bookings.length > 0) {
    var dots = document.createElement('div');
    dots.className = 'cal-day-dots';
    bookings.forEach(function(b) {
      var dot = document.createElement('div');
      dot.className = 'cal-dot ' + (STATUS_CLASS[b.status] || 'status-inquiry');
      dots.appendChild(dot);
    });
    cell.appendChild(dots);

    // Count badge for 2+
    if (bookings.length >= 2) {
      var badge = document.createElement('div');
      badge.className = 'cal-day-count';
      badge.textContent = bookings.length;
      cell.appendChild(badge);
    }
  }

  // Click handler
  if (dateKey && !isOther) {
    cell.addEventListener('click', function() {
      selectDay(dateKey);
    });
  }

  return cell;
}

function selectDay(dateKey) {
  // Toggle selection
  if (state.selectedDate === dateKey) {
    state.selectedDate = null;
    // Deselect visually
    var prev = document.querySelector('.cal-day.selected');
    if (prev) prev.classList.remove('selected');
    if (isMobile()) {
      closeDayAccordion();
    } else {
      clearDayPanel();
    }
    return;
  }

  // Deselect previous
  var prevCell = document.querySelector('.cal-day.selected');
  if (prevCell) prevCell.classList.remove('selected');

  state.selectedDate = dateKey;

  // Select new
  var newCell = document.querySelector('.cal-day[data-date="' + dateKey + '"]');
  if (newCell) newCell.classList.add('selected');

  if (isMobile()) {
    toggleDayAccordion(dateKey);
  } else {
    showDayPanel(dateKey);
  }
}

// ── NAVIGATION ────────────────────────────────────────────

function changeMonth(dir) {
  state.viewMonth += dir;
  if (state.viewMonth < 0) {
    state.viewMonth = 11;
    state.viewYear--;
  } else if (state.viewMonth > 11) {
    state.viewMonth = 0;
    state.viewYear++;
  }
  state.selectedDate = null;
  closeDayAccordion();
  if (!isMobile()) clearDayPanel();
  loadData();
}

function goToday() {
  var now = new Date();
  state.viewYear = now.getFullYear();
  state.viewMonth = now.getMonth();
  loadData();
  // After data loads, select today
  setTimeout(function() {
    selectDay(fmtKey(now));
  }, 500);
}

function initNavigation() {
  document.getElementById('prevMonth').addEventListener('click', function() {
    changeMonth(-1);
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    changeMonth(1);
  });
  document.getElementById('todayBtn').addEventListener('click', function() {
    goToday();
  });
  document.getElementById('refreshBtn').addEventListener('click', function() {
    var btn = document.getElementById('refreshBtn');
    btn.classList.add('refreshing');
    loadData();
    setTimeout(function() { btn.classList.remove('refreshing'); }, 1000);
  });
}

// ── DAY PANEL ──────────────────────────────────────────────

function showDayPanel(dateKey) {
  var bookings = getBookingsByDate(dateKey);
  var d = new Date(dateKey + 'T00:00:00');
  var dayOfWeek = (d.getDay() + 6) % 7;

  var panelDate = document.getElementById('panelDate');
  panelDate.textContent = LT_WEEKDAYS_FULL[dayOfWeek] + ', ' +
    d.getDate() + ' ' + LT_MONTHS_GEN[d.getMonth()];

  var panelMeta = document.getElementById('panelMeta');
  if (bookings.length > 0) {
    var revenue = getDayRevenue(bookings);
    panelMeta.textContent = bookings.length + ' užsakym' +
      pluralLT(bookings.length) + ' · ' + formatPrice(revenue);
  } else {
    panelMeta.textContent = 'Nėra užsakymų';
  }

  var panelBody = document.getElementById('panelBody');
  panelBody.classList.add('exiting');

  setTimeout(function() {
    panelBody.innerHTML = '';
    panelBody.classList.remove('exiting');

    if (bookings.length === 0) {
      panelBody.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-text">Šią dieną užsakymų nėra</div>' +
        '</div>';
    } else {
      bookings.forEach(function(b, idx) {
        var card = buildBookingCard(b);
        card.style.animationDelay = (idx * 60) + 'ms';
        panelBody.appendChild(card);
      });
    }

    panelBody.classList.add('entering');
    setTimeout(function() { panelBody.classList.remove('entering'); }, 250);
  }, 160);
}

function clearDayPanel() {
  document.getElementById('panelDate').textContent = 'Pasirinkite dieną';
  document.getElementById('panelMeta').textContent = '';
  var panelBody = document.getElementById('panelBody');
  panelBody.innerHTML =
    '<div class="empty-state">' +
    '<div class="empty-state-icon">📅</div>' +
    '<div class="empty-state-text">Pasirinkite dieną kalendoriuje</div>' +
    '</div>';
}

// MOBILE ACCORDION
function toggleDayAccordion(dateKey) {
  var existing = document.getElementById('dayAccordion');

  if (existing && existing.dataset.date === dateKey) {
    closeDayAccordion();
    return;
  }

  if (existing) existing.remove();

  var bookings = getBookingsByDate(dateKey);
  var d = new Date(dateKey + 'T00:00:00');
  var dayOfWeek = (d.getDay() + 6) % 7;

  var acc = document.createElement('div');
  acc.className = 'day-accordion';
  acc.id = 'dayAccordion';
  acc.dataset.date = dateKey;

  var header = document.createElement('div');
  header.className = 'panel-header';
  var dateStr = LT_WEEKDAYS_FULL[dayOfWeek] + ', ' +
    d.getDate() + ' ' + LT_MONTHS_GEN[d.getMonth()];
  header.innerHTML = '<div class="panel-date">' + escHtml(dateStr) + '</div>';
  if (bookings.length > 0) {
    var revenue = getDayRevenue(bookings);
    header.innerHTML += '<div class="panel-meta">' +
      bookings.length + ' užsakym' + pluralLT(bookings.length) +
      ' · ' + formatPrice(revenue) + '</div>';
  } else {
    header.innerHTML += '<div class="panel-meta">Nėra užsakymų</div>';
  }
  acc.appendChild(header);

  if (bookings.length === 0) {
    var emptyDiv = document.createElement('div');
    emptyDiv.className = 'empty-state';
    emptyDiv.style.padding = '20px';
    emptyDiv.innerHTML = '<div class="empty-state-icon">📭</div>' +
      '<div class="empty-state-text">Šią dieną užsakymų nėra</div>';
    acc.appendChild(emptyDiv);
  } else {
    bookings.forEach(function(b) {
      acc.appendChild(buildBookingCard(b));
    });
  }

  var clickedCell = document.querySelector('.cal-day[data-date="' + dateKey + '"]');
  if (clickedCell) {
    var grid = document.getElementById('calGrid');
    var cells = Array.from(grid.children);
    var cellIndex = cells.indexOf(clickedCell);
    var adjustedIndex = cellIndex - 7;
    var rowEnd = 7 + (Math.floor(adjustedIndex / 7) + 1) * 7;
    var afterEl = cells[Math.min(rowEnd - 1, cells.length - 1)];
    afterEl.after(acc);
  } else {
    document.getElementById('calGrid').appendChild(acc);
  }

  acc.style.maxHeight = '0';
  acc.style.overflow = 'hidden';
  requestAnimationFrame(function() {
    acc.style.transition = 'max-height 250ms ease-out';
    acc.style.maxHeight = acc.scrollHeight + 'px';
    setTimeout(function() {
      acc.style.maxHeight = 'none';
      acc.style.overflow = 'visible';
    }, 260);
  });

  setTimeout(function() {
    acc.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function closeDayAccordion() {
  var acc = document.getElementById('dayAccordion');
  if (acc) {
    acc.style.overflow = 'hidden';
    acc.style.maxHeight = acc.scrollHeight + 'px';
    requestAnimationFrame(function() {
      acc.style.transition = 'max-height 200ms ease-in';
      acc.style.maxHeight = '0';
      setTimeout(function() { acc.remove(); }, 210);
    });
  }
}

// ── BOOKING CARD ───────────────────────────────────────────

function buildBookingCard(b) {
  var card = document.createElement('div');
  card.className = 'booking-card';

  var eventTime = getEventTime(b);
  var pickupTime = getPickupTime(b);
  var statusKey = b.status || 'Inquiry';
  var paymentKey = b.payment_status || 'Unpaid';
  var equipNames = getEquipmentNames(b);
  var equipIcons = getEquipmentIcons(b);
  var phone = b.customer_phone || '';
  var address = b.delivery_address || '';
  var city = b.city || '';
  var price = b.price != null ? formatPrice(parseFloat(b.price)) : '—';
  var notes = b.notes || '';

  var timeStr = eventTime;
  if (pickupTime) timeStr += ' → ' + pickupTime;

  var html = '';

  html += '<div class="booking-card-header">';
  html += '<div class="booking-card-name">' + escHtml(b.customer_name || '—') + '</div>';
  html += '<div class="booking-card-time">' + escHtml(timeStr) + '</div>';
  html += '</div>';

  if (phone) {
    html += '<div class="booking-card-row">';
    html += '<span class="icon">📞</span>';
    html += '<a href="tel:' + escHtml(phone) + '">' + escHtml(phone) + '</a>';
    html += '</div>';
  }

  if (address) {
    html += '<div class="booking-card-row">';
    html += '<span class="icon">📍</span>';
    html += '<span>' + escHtml(address) + (city ? ', ' + escHtml(city) : '') + '</span>';
    html += '</div>';
  }

  if (notes) {
    html += '<div class="booking-card-row">';
    html += '<span class="icon">📝</span>';
    html += '<span>' + escHtml(notes) + '</span>';
    html += '</div>';
  }

  if (equipNames.length > 0) {
    html += '<div class="booking-card-equipment">';
    equipNames.forEach(function(name, idx) {
      var icon = equipIcons[idx] || '';
      html += '<span class="booking-card-equip-tag">' +
        (icon ? icon + ' ' : '') + escHtml(name) + '</span>';
    });
    html += '</div>';
  }

  html += '<div class="booking-card-footer">';
  html += '<div class="booking-card-price">' + price + '</div>';
  html += '<div>';
  html += '<span class="status-badge ' + (STATUS_CLASS[statusKey] || '') + '">' +
    escHtml(STATUS_LT[statusKey] || statusKey) + '</span> ';
  html += '<span class="payment-badge ' + (PAYMENT_CLASS[paymentKey] || '') + '">' +
    escHtml(PAYMENT_LT[paymentKey] || paymentKey) + '</span>';
  html += '</div>';
  html += '</div>';

  card.innerHTML = html;
  return card;
}

// ── HELPERS ────────────────────────────────────────────────

function pluralLT(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'as';
  if (n % 10 >= 2 && n % 10 <= 9 && (n % 100 < 10 || n % 100 >= 20)) return 'ai';
  return 'ų';
}

function formatPrice(val) {
  if (isNaN(val)) return '—';
  return val.toFixed(0) + ' €';
}

function escHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── EQUIPMENT STRIP ────────────────────────────────────────

function renderEquipment() {
  var strip = document.getElementById('equipStrip');
  strip.innerHTML = '';

  state.equipment.forEach(function(eq) {
    var statusKey = eq.current_status || eq.status || 'Available';
    var statusClass = EQUIP_STATUS_CLASS[statusKey] || 'equip-available';

    var pill = document.createElement('div');
    pill.className = 'equip-pill ' + statusClass;

    pill.innerHTML =
      '<span class="equip-icon">' + (eq.icon || '🎪') + '</span>' +
      '<span class="equip-name">' + escHtml(eq.name) + '</span>' +
      '<span class="equip-status">' + (EQUIP_STATUS_LT[statusKey] || statusKey) + '</span>';

    strip.appendChild(pill);
  });
}

// ── STATS ──────────────────────────────────────────────────

function renderStats() {
  var s = state.stats;

  var todayCount = parseInt(s.today_count) || 0;
  var weekRevenue = parseFloat(s.week_revenue) || 0;
  var lastWeekRevenue = parseFloat(s.last_week_revenue) || 0;
  var unpaid = parseInt(s.unpaid_deposits) || 0;
  var available = parseInt(s.available_equipment) || 0;
  var totalEquip = state.equipment.length || 20;

  if (state.firstLoad) {
    animateNumber(document.getElementById('statTodayCount'), todayCount, 600, '');
    animateNumber(document.getElementById('statWeekRevenue'), weekRevenue, 600, ' €');
    animateNumber(document.getElementById('statUnpaid'), unpaid, 600, '');
    animateNumber(document.getElementById('statAvailable'), available, 600, '');
  } else {
    document.getElementById('statTodayCount').textContent = todayCount;
    document.getElementById('statWeekRevenue').textContent = weekRevenue.toFixed(0) + ' €';
    document.getElementById('statUnpaid').textContent = unpaid;
    document.getElementById('statAvailable').textContent = available;
  }

  var weekSub = document.getElementById('statWeekSub');
  if (lastWeekRevenue > 0) {
    var diff = weekRevenue - lastWeekRevenue;
    var pct = ((diff / lastWeekRevenue) * 100).toFixed(0);
    var arrow = diff >= 0 ? '↑' : '↓';
    var color = diff >= 0 ? 'var(--green)' : 'var(--red)';
    weekSub.innerHTML = '<span style="color:' + color + '">' + arrow + ' ' +
      Math.abs(pct) + '% nuo praėj. sav.</span>';
  } else {
    weekSub.textContent = '';
  }

  document.getElementById('statAvailableSub').textContent = 'iš ' + totalEquip;

  if (state.lastFetched) {
    var h = pad(state.lastFetched.getHours());
    var m = pad(state.lastFetched.getMinutes());
    document.getElementById('lastUpdated').textContent = h + ':' + m;
  }
}

function animateNumber(el, target, duration, suffix) {
  if (!el) return;
  if (target === 0) {
    el.textContent = '0' + (suffix || '');
    return;
  }

  var start = performance.now();
  function frame(now) {
    var progress = Math.min((now - start) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = Math.round(eased * target);
    el.textContent = current + (suffix || '');
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ── UTILS ──────────────────────────────────────────────────

function pad(n) {
  return n < 10 ? '0' + n : String(n);
}

function fmtKey(date) {
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

function isMobile() {
  return window.innerWidth < 768;
}

function showLoading(on) {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.toggle('hidden', !on);
}

function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'toast ' + (type || 'info') + ' visible';
  setTimeout(function() { toast.classList.remove('visible'); }, 3000);
}

function renderAll() {
  renderCalendar();
  renderStats();
  renderEquipment();

  if (state.selectedDate) {
    if (isMobile()) {
      // Don't auto-reopen accordion on refresh
    } else {
      showDayPanel(state.selectedDate);
    }
  }
}

// ── INIT ───────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {
  initNavigation();
  loadData();

  setInterval(function() { loadData(); }, REFRESH_INTERVAL_MS);

  window.addEventListener('resize', function() {
    var acc = document.getElementById('dayAccordion');
    if (!isMobile() && acc) {
      acc.remove();
      if (state.selectedDate) showDayPanel(state.selectedDate);
    }
  });
});
</script>
